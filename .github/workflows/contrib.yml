name: contributions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/contrib.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build contrib.svg
        env:
          # optional PAT secret (read:user) also counts private contributions
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/contrib.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib.svg assets/contrib.json
          git diff --cached --quiet || (git commit -m "update contributions" && git push)
